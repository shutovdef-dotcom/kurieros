name: Deploy Astro to Timeweb

on:
  workflow_dispatch:
    inputs:
      deploy_method:
        description: Deployment transport to use.
        required: false
        type: choice
        default: archive
        options:
          - archive
          - ssh-archive
          - ftp-mirror
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-timeweb.yml'
      - 'kurieros-astro/**'

permissions:
  contents: read

concurrency:
  group: timeweb-production
  cancel-in-progress: false

env:
  PROJECT_DIR: kurieros-astro
  NODE_VERSION: '24.x'
  SITE_URL: https://kurerok.ru
  SITE_BASE: /
  PUBLIC_GA4_MEASUREMENT_ID: G-686FXGHBWB
  PUBLIC_YANDEX_METRIKA_ID: '108655359'
  PUBLIC_OWNER_SEO_HASH: f08d870722fc49f961b4bddb87fe6b15c226f7880c5cc1da17697ce9be527073
  PUBLIC_GSC_PROPERTY_URL: sc-domain:kurerok.ru
  PUBLIC_YANDEX_WEBMASTER_HOST: https:kurerok.ru:443
  PUBLIC_YANDEX_VERIFICATION: 9a662580de5ebac5
  PUBLIC_GOOGLE_SITE_VERIFICATION: QIGlMj-JAXkxvnkeFNNu6hWJ5bslKtguuUxY4ty17bI
  PUBLIC_OZON_LEAD_API: ${{ vars.PUBLIC_OZON_LEAD_API }}
  TIMEWEB_DEPLOY_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_method || vars.TIMEWEB_DEPLOY_METHOD || 'archive' }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.TIMEWEB_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate Yandex vacancy feed
        run: npm run check:yandex-feed

      - name: Validate generated output
        run: npm run test:dist

      - name: Enforce dist size budget
        run: npm run size:dist:check

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurerok-dist
          path: ${{ env.PROJECT_DIR }}/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: timeweb-production
      url: https://kurerok.ru/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: kurerok-dist
          path: dist

      - name: Install lftp
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'ftp-mirror' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      - name: Preflight Timeweb configuration
        env:
          TIMEWEB_DEPLOY_METHOD: ${{ env.TIMEWEB_DEPLOY_METHOD }}
          TIMEWEB_FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          TIMEWEB_FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_REMOTE_DIR: ${{ vars.TIMEWEB_REMOTE_DIR }}
          TIMEWEB_REMOTE_ROOT_IS_SITE_ROOT: ${{ vars.TIMEWEB_REMOTE_ROOT_IS_SITE_ROOT }}
          TIMEWEB_UNPACK_URL: ${{ vars.TIMEWEB_UNPACK_URL }}
          TIMEWEB_SSH_HOST: ${{ secrets.TIMEWEB_SSH_HOST }}
          TIMEWEB_SSH_USER: ${{ secrets.TIMEWEB_SSH_USER }}
          TIMEWEB_SSH_PRIVATE_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          TIMEWEB_SSH_REMOTE_ROOT: ${{ vars.TIMEWEB_SSH_REMOTE_ROOT }}
        run: |
          set -euo pipefail

          case "$TIMEWEB_DEPLOY_METHOD" in
            archive|ssh-archive|ftp-mirror) ;;
            *)
              echo "::error::Unsupported TIMEWEB_DEPLOY_METHOD: $TIMEWEB_DEPLOY_METHOD"
              exit 1
              ;;
          esac

          missing=0

          if [ "$TIMEWEB_DEPLOY_METHOD" = "archive" ] || [ "$TIMEWEB_DEPLOY_METHOD" = "ftp-mirror" ]; then
            for name in TIMEWEB_FTP_HOST TIMEWEB_FTP_USER TIMEWEB_FTP_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is not configured"
                missing=1
              fi
            done
          fi

          if [ "$TIMEWEB_DEPLOY_METHOD" = "archive" ]; then
            if [ -z "${TIMEWEB_UNPACK_URL:-}" ]; then
              echo "::error::TIMEWEB_UNPACK_URL is required for archive deployment. Use a Timeweb technical domain before DNS cutover, then https://kurerok.ru after cutover."
              missing=1
            fi
          fi

          if [ "$TIMEWEB_DEPLOY_METHOD" = "ssh-archive" ]; then
            for name in TIMEWEB_SSH_HOST TIMEWEB_SSH_USER TIMEWEB_SSH_PRIVATE_KEY TIMEWEB_SSH_REMOTE_ROOT; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is required for ssh-archive deployment"
                missing=1
              fi
            done
          fi

          [ "$missing" -eq 0 ]

          remote_dir="${TIMEWEB_REMOTE_DIR:-/}"
          case "$remote_dir" in
            */) ;;
            *) remote_dir="${remote_dir}/" ;;
          esac

          if [ "$remote_dir" = "/" ] && [ "${TIMEWEB_REMOTE_ROOT_IS_SITE_ROOT:-}" != "true" ]; then
            echo "::error::TIMEWEB_REMOTE_DIR is '/', but TIMEWEB_REMOTE_ROOT_IS_SITE_ROOT is not true. Use a FTP user scoped to the site's public_html directory or set TIMEWEB_REMOTE_DIR to the absolute public_html path."
            exit 1
          fi

          echo "TIMEWEB_REMOTE_DIR_NORMALIZED=$remote_dir" >> "$GITHUB_ENV"

      - name: Prepare SSH access
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'ssh-archive' }}
        env:
          TIMEWEB_SSH_HOST: ${{ secrets.TIMEWEB_SSH_HOST }}
          TIMEWEB_SSH_PRIVATE_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          TIMEWEB_SSH_PORT: ${{ vars.TIMEWEB_SSH_PORT }}
        run: |
          set -euo pipefail

          key_path="$RUNNER_TEMP/timeweb_deploy_key"
          known_hosts_path="$RUNNER_TEMP/timeweb_known_hosts"

          printf '%s\n' "$TIMEWEB_SSH_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          ssh-keyscan -p "${TIMEWEB_SSH_PORT:-22}" "$TIMEWEB_SSH_HOST" > "$known_hosts_path"

          echo "TIMEWEB_SSH_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "TIMEWEB_SSH_KNOWN_HOSTS_PATH=$known_hosts_path" >> "$GITHUB_ENV"

      - name: Deploy archive to Timeweb over SSH
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'ssh-archive' }}
        env:
          TIMEWEB_SSH_HOST: ${{ secrets.TIMEWEB_SSH_HOST }}
          TIMEWEB_SSH_USER: ${{ secrets.TIMEWEB_SSH_USER }}
          TIMEWEB_SSH_PORT: ${{ vars.TIMEWEB_SSH_PORT }}
          TIMEWEB_SSH_REMOTE_ROOT: ${{ vars.TIMEWEB_SSH_REMOTE_ROOT }}
        run: |
          set -euo pipefail

          "$PROJECT_DIR/scripts/timeweb-ssh-archive-deploy.sh" \
            --source-dir dist \
            --host "$TIMEWEB_SSH_HOST" \
            --port "${TIMEWEB_SSH_PORT:-22}" \
            --user "$TIMEWEB_SSH_USER" \
            --identity-file "$TIMEWEB_SSH_KEY_PATH" \
            --known-hosts "$TIMEWEB_SSH_KNOWN_HOSTS_PATH" \
            --remote-root "$TIMEWEB_SSH_REMOTE_ROOT"

      - name: Deploy archive to Timeweb
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'archive' }}
        env:
          TIMEWEB_FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          TIMEWEB_FTP_PORT: ${{ vars.TIMEWEB_FTP_PORT }}
          TIMEWEB_FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_FTP_TLS: ${{ vars.TIMEWEB_FTP_TLS }}
          TIMEWEB_UNPACK_URL: ${{ vars.TIMEWEB_UNPACK_URL }}
          TIMEWEB_UNPACK_INSECURE_HTTPS: ${{ vars.TIMEWEB_UNPACK_INSECURE_HTTPS }}
        run: |
          set -euo pipefail

          args=(
            --source-dir dist
            --ftp-host "$TIMEWEB_FTP_HOST"
            --ftp-port "${TIMEWEB_FTP_PORT:-21}"
            --ftp-user "$TIMEWEB_FTP_USER"
            --ftp-password-env TIMEWEB_FTP_PASSWORD
            --remote-root "$TIMEWEB_REMOTE_DIR_NORMALIZED"
            --unpack-url "$TIMEWEB_UNPACK_URL"
          )

          if [ "${TIMEWEB_FTP_TLS:-false}" = "true" ]; then
            args+=(--ftp-tls)
          fi

          if [ "${TIMEWEB_UNPACK_INSECURE_HTTPS:-false}" = "true" ]; then
            args+=(--insecure-https)
          fi

          python3 "$PROJECT_DIR/scripts/timeweb-archive-deploy.py" "${args[@]}"

      - name: Deploy dist to Timeweb with FTP mirror
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'ftp-mirror' }}
        env:
          TIMEWEB_FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          TIMEWEB_FTP_PORT: ${{ vars.TIMEWEB_FTP_PORT }}
          TIMEWEB_FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_FTP_TLS: ${{ vars.TIMEWEB_FTP_TLS }}
        run: |
          set -euo pipefail

          ftp_port="${TIMEWEB_FTP_PORT:-21}"
          tls_mode="${TIMEWEB_FTP_TLS:-false}"

          if [ "$tls_mode" = "true" ]; then
            security_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true\nset ssl:verify-certificate true'
          else
            security_settings=$'set ftp:ssl-allow false'
          fi

          lftp -p "$ftp_port" -u "$TIMEWEB_FTP_USER","$TIMEWEB_FTP_PASSWORD" "$TIMEWEB_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          $security_settings
          mirror --reverse --delete --parallel=4 --verbose=1 --exclude-glob .htaccess --exclude-glob .well-known --exclude-glob .well-known/** ./dist/ "$TIMEWEB_REMOTE_DIR_NORMALIZED"
          bye
          LFTP

      - name: Optional production smoke check
        if: ${{ vars.TIMEWEB_VERIFY_URL != '' }}
        env:
          TIMEWEB_VERIFY_URL: ${{ vars.TIMEWEB_VERIFY_URL }}
        run: |
          set -euo pipefail
          curl -fsSI "$TIMEWEB_VERIFY_URL" | sed -n '1,20p'
