name: Deploy Astro to Timeweb

on:
  workflow_dispatch:
    inputs:
      deploy_method:
        description: Deployment transport to use.
        required: false
        type: choice
        default: archive
        options:
          - archive
          - ssh-archive
          - ftp-mirror
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-timeweb.yml'
      - 'kurieros-astro/**'
  schedule:
    # 09:05, 12:05, 15:05 and 18:05 Europe/Moscow. The cursor still enforces
    # the actual 24-hour release window, so extra wake-ups cannot publish a
    # catch-up burst.
    - cron: '5 6,9,12,15 * * *'

permissions:
  contents: read

concurrency:
  group: timeweb-production
  cancel-in-progress: false

env:
  PROJECT_DIR: kurieros-astro
  NODE_VERSION: '24.x'
  SITE_URL: https://kurerok.ru
  SITE_BASE: /
  PUBLIC_GA4_MEASUREMENT_ID: G-686FXGHBWB
  PUBLIC_YANDEX_METRIKA_ID: '108655359'
  PUBLIC_OWNER_SEO_HASH: f08d870722fc49f961b4bddb87fe6b15c226f7880c5cc1da17697ce9be527073
  PUBLIC_GSC_PROPERTY_URL: sc-domain:kurerok.ru
  PUBLIC_YANDEX_WEBMASTER_HOST: https:kurerok.ru:443
  PUBLIC_YANDEX_VERIFICATION: 9a662580de5ebac5
  PUBLIC_GOOGLE_SITE_VERIFICATION: QIGlMj-JAXkxvnkeFNNu6hWJ5bslKtguuUxY4ty17bI
  PUBLIC_OZON_LEAD_API: ${{ vars.PUBLIC_OZON_LEAD_API }}
  TIMEWEB_DEPLOY_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_method || vars.TIMEWEB_DEPLOY_METHOD || 'archive' }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.TIMEWEB_AUTO_DEPLOY == 'true' && !contains(github.event.head_commit.message, '[blog-ledger]')) ||
      (github.event_name == 'schedule' && vars.BLOG_SCHEDULE_ENABLED == 'true' && vars.CONTENT_SCHEDULE_PAUSED == 'false')
    runs-on: ubuntu-latest
    # Scheduled releases need the same protected variables and secrets as the
    # production deploy. It also makes an environment-scoped INDEXNOW_KEY
    # available only inside this reviewed release path.
    environment:
      name: timeweb-production
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
      scheduled_candidate: ${{ steps.decision.outputs.scheduled_candidate }}
      scheduled_slug: ${{ steps.decision.outputs.scheduled_slug }}
      scheduled_candidate_json: ${{ steps.prepare.outputs.candidate_json }}
      scheduled_candidate_provisional_at: ${{ steps.prepare.outputs.released_at }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require SSH transport for automatic blog release
        id: scheduled-transport
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          if [ "$TIMEWEB_DEPLOY_METHOD" = 'ssh-archive' ]; then
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          else
            echo 'safe=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Scheduled blog release requires TIMEWEB_DEPLOY_METHOD=ssh-archive; no candidate or deploy will be created."
          fi

      - name: Setup Node.js
        if: github.event_name != 'schedule' || steps.scheduled-transport.outputs.safe == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.scheduled-transport.outputs.safe == 'true'
        run: npm ci

      - name: Reconcile durable blog ledger with production manifest
        id: reconcile
        if: github.event_name != 'schedule' || steps.scheduled-transport.outputs.safe == 'true'
        env:
          BLOG_RELEASE_REMOTE_MANIFEST_URL: https://kurerok.ru/api/blog-release-manifest.json
        run: npm run blog:release -- sync-production-manifest --allow-missing-remote-if-local-empty

      - name: Validate full editorial blog corpus
        if: github.event_name == 'schedule' && steps.scheduled-transport.outputs.safe == 'true'
        run: npm run check:blog-content

      - name: Prepare one due blog release candidate
        id: prepare
        if: github.event_name == 'schedule' && steps.scheduled-transport.outputs.safe == 'true'
        run: |
          set -euo pipefail
          BLOG_RELEASE_NOW="$(date --iso-8601=seconds)" \
          BLOG_SCHEDULE_ENABLED=true \
          CONTENT_SCHEDULE_PAUSED=false \
          BLOG_RELEASE_DEPLOY_SHA="$GITHUB_SHA" \
          npm run blog:release -- prepare

      - name: Decide whether this run has a deployable change
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          SAFE_SCHEDULE_TRANSPORT: ${{ steps.scheduled-transport.outputs.safe }}
          HAS_CANDIDATE: ${{ steps.prepare.outputs.has_candidate }}
          CANDIDATE_SLUG: ${{ steps.prepare.outputs.slug }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != 'schedule' ]; then
            echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
            echo 'scheduled_candidate=false' >> "$GITHUB_OUTPUT"
            echo 'scheduled_slug=' >> "$GITHUB_OUTPUT"
          elif [ "$SAFE_SCHEDULE_TRANSPORT" != 'true' ]; then
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
            echo 'scheduled_candidate=false' >> "$GITHUB_OUTPUT"
            echo 'scheduled_slug=' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CANDIDATE" = 'true' ]; then
            echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
            echo 'scheduled_candidate=true' >> "$GITHUB_OUTPUT"
            echo "scheduled_slug=$CANDIDATE_SLUG" >> "$GITHUB_OUTPUT"
          else
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
            echo 'scheduled_candidate=false' >> "$GITHUB_OUTPUT"
            echo 'scheduled_slug=' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare IndexNow ownership file for this release artifact
        if: steps.decision.outputs.scheduled_candidate == 'true' && vars.BLOG_INDEXNOW_ENABLED == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npm run indexnow:prepare-key

      - name: Lint
        if: steps.decision.outputs.should_deploy == 'true'
        run: npm run lint

      - name: Type check
        if: steps.decision.outputs.should_deploy == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.decision.outputs.should_deploy == 'true'
        run: npm run test

      - name: Build
        if: steps.decision.outputs.should_deploy == 'true'
        env:
          # An ignored candidate is never honoured by an ordinary build.
          BLOG_RELEASE_ALLOW_CANDIDATE: ${{ steps.decision.outputs.scheduled_candidate == 'true' && 'true' || 'false' }}
        run: npm run build

      - name: Audit SEO surface and exact blog ledger delta
        if: steps.decision.outputs.should_deploy == 'true'
        run: npm run seo:audit

      - name: Validate Yandex vacancy feed
        if: steps.decision.outputs.should_deploy == 'true'
        run: npm run check:yandex-feed

      - name: Validate generated output
        if: steps.decision.outputs.should_deploy == 'true'
        run: npm run test:dist

      - name: Enforce dist size budget
        if: steps.decision.outputs.should_deploy == 'true'
        run: npm run size:dist:check

      - name: Upload dist artifact
        if: steps.decision.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kurerok-dist
          path: ${{ env.PROJECT_DIR }}/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: timeweb-production
      url: https://kurerok.ru/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: kurerok-dist
          path: dist

      - name: Install lftp
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'ftp-mirror' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      - name: Preflight Timeweb configuration
        env:
          TIMEWEB_DEPLOY_METHOD: ${{ env.TIMEWEB_DEPLOY_METHOD }}
          TIMEWEB_FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          TIMEWEB_FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_REMOTE_DIR: ${{ vars.TIMEWEB_REMOTE_DIR }}
          TIMEWEB_REMOTE_ROOT_IS_SITE_ROOT: ${{ vars.TIMEWEB_REMOTE_ROOT_IS_SITE_ROOT }}
          TIMEWEB_UNPACK_URL: ${{ vars.TIMEWEB_UNPACK_URL }}
          TIMEWEB_SSH_HOST: ${{ secrets.TIMEWEB_SSH_HOST }}
          TIMEWEB_SSH_USER: ${{ secrets.TIMEWEB_SSH_USER }}
          TIMEWEB_SSH_PRIVATE_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          TIMEWEB_SSH_REMOTE_ROOT: ${{ vars.TIMEWEB_SSH_REMOTE_ROOT }}
        run: |
          set -euo pipefail

          case "$TIMEWEB_DEPLOY_METHOD" in
            archive|ssh-archive|ftp-mirror) ;;
            *)
              echo "::error::Unsupported TIMEWEB_DEPLOY_METHOD: $TIMEWEB_DEPLOY_METHOD"
              exit 1
              ;;
          esac

          missing=0

          if [ "$TIMEWEB_DEPLOY_METHOD" = "archive" ] || [ "$TIMEWEB_DEPLOY_METHOD" = "ftp-mirror" ]; then
            for name in TIMEWEB_FTP_HOST TIMEWEB_FTP_USER TIMEWEB_FTP_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is not configured"
                missing=1
              fi
            done
          fi

          if [ "$TIMEWEB_DEPLOY_METHOD" = "archive" ]; then
            if [ -z "${TIMEWEB_UNPACK_URL:-}" ]; then
              echo "::error::TIMEWEB_UNPACK_URL is required for archive deployment. Use a Timeweb technical domain before DNS cutover, then https://kurerok.ru after cutover."
              missing=1
            fi
          fi

          if [ "$TIMEWEB_DEPLOY_METHOD" = "ssh-archive" ]; then
            for name in TIMEWEB_SSH_HOST TIMEWEB_SSH_USER TIMEWEB_SSH_PRIVATE_KEY TIMEWEB_SSH_REMOTE_ROOT; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is required for ssh-archive deployment"
                missing=1
              fi
            done
          fi

          [ "$missing" -eq 0 ]

          remote_dir="${TIMEWEB_REMOTE_DIR:-/}"
          case "$remote_dir" in
            */) ;;
            *) remote_dir="${remote_dir}/" ;;
          esac

          if [ "$remote_dir" = "/" ] && [ "${TIMEWEB_REMOTE_ROOT_IS_SITE_ROOT:-}" != "true" ]; then
            echo "::error::TIMEWEB_REMOTE_DIR is '/', but TIMEWEB_REMOTE_ROOT_IS_SITE_ROOT is not true. Use a FTP user scoped to the site's public_html directory or set TIMEWEB_REMOTE_DIR to the absolute public_html path."
            exit 1
          fi

          echo "TIMEWEB_REMOTE_DIR_NORMALIZED=$remote_dir" >> "$GITHUB_ENV"

      - name: Prepare SSH access
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'ssh-archive' }}
        env:
          TIMEWEB_SSH_HOST: ${{ secrets.TIMEWEB_SSH_HOST }}
          TIMEWEB_SSH_PRIVATE_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          TIMEWEB_SSH_PORT: ${{ vars.TIMEWEB_SSH_PORT }}
        run: |
          set -euo pipefail

          key_path="$RUNNER_TEMP/timeweb_deploy_key"
          known_hosts_path="$RUNNER_TEMP/timeweb_known_hosts"

          printf '%s\n' "$TIMEWEB_SSH_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          ssh-keyscan -p "${TIMEWEB_SSH_PORT:-22}" "$TIMEWEB_SSH_HOST" > "$known_hosts_path"

          echo "TIMEWEB_SSH_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "TIMEWEB_SSH_KNOWN_HOSTS_PATH=$known_hosts_path" >> "$GITHUB_ENV"

      - name: Deploy archive to Timeweb over SSH
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'ssh-archive' }}
        env:
          TIMEWEB_SSH_HOST: ${{ secrets.TIMEWEB_SSH_HOST }}
          TIMEWEB_SSH_USER: ${{ secrets.TIMEWEB_SSH_USER }}
          TIMEWEB_SSH_PORT: ${{ vars.TIMEWEB_SSH_PORT }}
          TIMEWEB_SSH_REMOTE_ROOT: ${{ vars.TIMEWEB_SSH_REMOTE_ROOT }}
          BLOG_RELEASE_STAMP_OLD: ${{ needs.build.outputs.scheduled_candidate_provisional_at }}
          BLOG_RELEASE_STAMP_SLUG: ${{ needs.build.outputs.scheduled_slug }}
        run: |
          set -euo pipefail

          args=(
            --source-dir dist
            --host "$TIMEWEB_SSH_HOST"
            --port "${TIMEWEB_SSH_PORT:-22}"
            --user "$TIMEWEB_SSH_USER"
            --identity-file "$TIMEWEB_SSH_KEY_PATH"
            --known-hosts "$TIMEWEB_SSH_KNOWN_HOSTS_PATH"
            --remote-root "$TIMEWEB_SSH_REMOTE_ROOT"
          )

          if [ "${{ needs.build.outputs.scheduled_candidate }}" = 'true' ]; then
            test -n "$BLOG_RELEASE_STAMP_OLD"
            test -n "$BLOG_RELEASE_STAMP_SLUG"
            args+=(
              --blog-release-stamp-old "$BLOG_RELEASE_STAMP_OLD"
              --blog-release-stamp-slug "$BLOG_RELEASE_STAMP_SLUG"
            )
          fi

          "$PROJECT_DIR/scripts/timeweb-ssh-archive-deploy.sh" "${args[@]}"

      - name: Deploy archive to Timeweb
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'archive' }}
        env:
          TIMEWEB_FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          TIMEWEB_FTP_PORT: ${{ vars.TIMEWEB_FTP_PORT }}
          TIMEWEB_FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_FTP_TLS: ${{ vars.TIMEWEB_FTP_TLS }}
          TIMEWEB_UNPACK_URL: ${{ vars.TIMEWEB_UNPACK_URL }}
          TIMEWEB_UNPACK_INSECURE_HTTPS: ${{ vars.TIMEWEB_UNPACK_INSECURE_HTTPS }}
        run: |
          set -euo pipefail

          args=(
            --source-dir dist
            --ftp-host "$TIMEWEB_FTP_HOST"
            --ftp-port "${TIMEWEB_FTP_PORT:-21}"
            --ftp-user "$TIMEWEB_FTP_USER"
            --ftp-password-env TIMEWEB_FTP_PASSWORD
            --remote-root "$TIMEWEB_REMOTE_DIR_NORMALIZED"
            --unpack-url "$TIMEWEB_UNPACK_URL"
          )

          if [ "${TIMEWEB_FTP_TLS:-false}" = "true" ]; then
            args+=(--ftp-tls)
          fi

          if [ "${TIMEWEB_UNPACK_INSECURE_HTTPS:-false}" = "true" ]; then
            args+=(--insecure-https)
          fi

          python3 "$PROJECT_DIR/scripts/timeweb-archive-deploy.py" "${args[@]}"

      - name: Deploy dist to Timeweb with FTP mirror
        if: ${{ env.TIMEWEB_DEPLOY_METHOD == 'ftp-mirror' }}
        env:
          TIMEWEB_FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          TIMEWEB_FTP_PORT: ${{ vars.TIMEWEB_FTP_PORT }}
          TIMEWEB_FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_FTP_TLS: ${{ vars.TIMEWEB_FTP_TLS }}
        run: |
          set -euo pipefail

          ftp_port="${TIMEWEB_FTP_PORT:-21}"
          tls_mode="${TIMEWEB_FTP_TLS:-false}"

          if [ "$tls_mode" = "true" ]; then
            security_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true\nset ssl:verify-certificate true'
          else
            security_settings=$'set ftp:ssl-allow false'
          fi

          lftp -p "$ftp_port" -u "$TIMEWEB_FTP_USER","$TIMEWEB_FTP_PASSWORD" "$TIMEWEB_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          $security_settings
          mirror --reverse --delete --parallel=4 --verbose=1 --exclude-glob .htaccess --exclude-glob .well-known --exclude-glob .well-known/** ./dist/ "$TIMEWEB_REMOTE_DIR_NORMALIZED"
          bye
          LFTP

      - name: Optional production smoke check
        if: ${{ vars.TIMEWEB_VERIFY_URL != '' }}
        env:
          TIMEWEB_VERIFY_URL: ${{ vars.TIMEWEB_VERIFY_URL }}
        run: |
          set -euo pipefail
          curl -fsSI "$TIMEWEB_VERIFY_URL" | sed -n '1,20p'

  record-blog-release:
    needs: [build, deploy]
    if: >-
      always() && github.event_name == 'schedule' &&
      needs.build.outputs.scheduled_candidate == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: timeweb-production
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout main for durable ledger update
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Reconcile the manifest actually visible in production
        id: production
        env:
          BLOG_RELEASE_REMOTE_MANIFEST_URL: https://kurerok.ru/api/blog-release-manifest.json?release=${{ github.sha }}
          BLOG_RELEASE_EXPECTED_CANDIDATE_JSON: ${{ needs.build.outputs.scheduled_candidate_json }}
        run: npm run blog:release -- sync-production-manifest

      - name: Require exactly one recoverable production record
        env:
          RECOVERED: ${{ steps.production.outputs.recovered }}
        run: |
          test "$RECOVERED" = 'true'

      - name: Commit durable blog release ledger
        run: |
          set -euo pipefail
          git add src/data/blog-release-ledger.json src/generated/blog-release-manifest.json
          if git diff --cached --quiet; then
            echo 'No durable ledger change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: record blog release [blog-ledger]'
          git push origin HEAD:main

      - name: Notify IndexNow about the one deployed blog URL
        if: needs.build.outputs.scheduled_candidate == 'true' && vars.BLOG_INDEXNOW_ENABLED == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npm run indexnow:submit -- "https://kurerok.ru/blog/${{ needs.build.outputs.scheduled_slug }}/"
