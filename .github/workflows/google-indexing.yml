name: Google Indexing API

on:
  workflow_dispatch:
    inputs:
      date:
        description: Optional Moscow date for the carousel, YYYY-MM-DD.
        required: false
        type: string
  schedule:
    # 10:20 Europe/Moscow: after the 09:05 production deploy wake-up and
    # after Google Indexing API's midnight Pacific quota reset (~10:00 MSK
    # during PDT). Running before the Pacific reset can burn the previous
    # quota day and make the daily carousel look like it "does nothing".
    - cron: '20 7 * * *'

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: google-indexing-api-main
  cancel-in-progress: false

env:
  PROJECT_DIR: kurieros-astro
  NODE_VERSION: '24.x'
  SITE_URL: https://kurerok.ru
  GOOGLE_CLOUD_PROJECT_ID: noble-truck-500507-i1

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: timeweb-production
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve carousel date
        id: params
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          date="${INPUT_DATE:-}"
          if [ -z "$date" ]; then
            date="$(TZ=Europe/Moscow date +%F)"
          fi
          if ! printf '%s' "$date" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::date must be YYYY-MM-DD, got: $date"
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Skip duplicate successful carousel for the same Moscow date
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          TARGET_DATE: ${{ steps.params.outputs.date }}
        run: |
          set -euo pipefail
          previous_success="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow google-indexing.yml \
              --branch main \
              --limit 30 \
              --json databaseId,conclusion,createdAt \
            | jq -r \
                --arg current "$CURRENT_RUN_ID" \
                --arg target "$TARGET_DATE" \
                '.[] |
                  select((.databaseId | tostring) != $current) |
                  select(.conclusion == "success") |
                  select(((.createdAt | fromdateiso8601) + 10800 | strftime("%Y-%m-%d")) == $target) |
                  .databaseId' \
            | head -n 1
          )"
          if [ -n "$previous_success" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "previous_success=$previous_success" >> "$GITHUB_OUTPUT"
            echo "A successful Google Indexing API run already exists for $TARGET_DATE: $previous_success"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Google keyless auth configuration
        if: steps.duplicate.outputs.skip != 'true'
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_INDEXING_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_INDEXING_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_WORKLOAD_IDENTITY_PROVIDER:-}" ]; then
            echo "::error::Missing GOOGLE_WORKLOAD_IDENTITY_PROVIDER environment variable."
            exit 1
          fi
          if [ -z "${GOOGLE_INDEXING_SERVICE_ACCOUNT_EMAIL:-}" ]; then
            echo "::error::Missing GOOGLE_INDEXING_SERVICE_ACCOUNT_EMAIL environment variable."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: steps.duplicate.outputs.skip != 'true'
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_INDEXING_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/indexing

      - name: Setup Node.js
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        if: steps.duplicate.outputs.skip != 'true'
        run: npm ci

      - name: Submit 200 live JobPosting URLs to Google
        if: steps.duplicate.outputs.skip != 'true'
        env:
          GOOGLE_INDEXING_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: npm run google:indexing:daily -- --date="${{ steps.params.outputs.date }}"

      - name: Upload recrawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-indexing-report-${{ steps.params.outputs.date }}
          path: ${{ env.PROJECT_DIR }}/output/recrawl-carousel/
          if-no-files-found: ignore
          retention-days: 14
