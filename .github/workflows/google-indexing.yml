name: Google Indexing API

on:
  workflow_dispatch:
    inputs:
      date:
        description: Optional Moscow date for the carousel, YYYY-MM-DD.
        required: false
        type: string
  schedule:
    # 09:20 Europe/Moscow, after the 09:05 production deploy wake-up.
    - cron: '20 6 * * *'

permissions:
  contents: read

concurrency:
  group: google-indexing-api-main
  cancel-in-progress: false

env:
  PROJECT_DIR: kurieros-astro
  NODE_VERSION: '24.x'
  SITE_URL: https://kurerok.ru

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: timeweb-production
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve carousel date
        id: params
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          date="${INPUT_DATE:-}"
          if [ -z "$date" ]; then
            date="$(TZ=Europe/Moscow date +%F)"
          fi
          if ! printf '%s' "$date" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::date must be YYYY-MM-DD, got: $date"
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Require Google Indexing API service account secret
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_INDEXING_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Missing GOOGLE_INDEXING_SERVICE_ACCOUNT secret. Add the service account JSON to the timeweb-production environment or repository secrets."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Submit 200 live JobPosting URLs to Google
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT }}
        run: npm run google:indexing:daily -- --date="${{ steps.params.outputs.date }}"

      - name: Upload recrawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-indexing-report-${{ steps.params.outputs.date }}
          path: ${{ env.PROJECT_DIR }}/output/recrawl-carousel/
          if-no-files-found: ignore
          retention-days: 14
