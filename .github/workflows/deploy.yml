name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install, build, and upload Astro site
        uses: withastro/action@v6
        env:
          SITE_URL: https://kurerok.ru
          SITE_BASE: /
          PUBLIC_GA4_MEASUREMENT_ID: G-686FXGHBWB
          PUBLIC_YANDEX_METRIKA_ID: 108655359
          PUBLIC_OWNER_SEO_HASH: f08d870722fc49f961b4bddb87fe6b15c226f7880c5cc1da17697ce9be527073
          PUBLIC_GSC_PROPERTY_URL: sc-domain:kurerok.ru
          PUBLIC_YANDEX_WEBMASTER_HOST: https:kurerok.ru:443
          PUBLIC_YANDEX_VERIFICATION: 9a662580de5ebac5
          PUBLIC_GOOGLE_SITE_VERIFICATION: QIGlMj-JAXkxvnkeFNNu6hWJ5bslKtguuUxY4ty17bI
          # Ozon lead-form integration. Sourced from repository
          # Variables (Settings → Secrets and variables → Actions →
          # Variables) so the Worker URL can be rotated without a
          # code change. Astro inlines PUBLIC_-prefixed env vars
          # into client bundles at build time.
          #
          # The lead form now POSTs to a Cloudflare Worker proxy
          # (kurerok-ozon-lead.shutovdef.workers.dev). The referrer
          # phone, Telegram bot token, and chat ID live as Worker
          # secrets so they NEVER reach the browser. The legacy
          # PUBLIC_OZON_REF_CODE / PUBLIC_TELEGRAM_BOT_TOKEN /
          # PUBLIC_TELEGRAM_CHAT_ID variables are no longer
          # consumed by the build; remove them from repo Variables
          # and rotate the bot token (it was previously inlined into
          # the public bundle).
          PUBLIC_OZON_LEAD_API: ${{ vars.PUBLIC_OZON_LEAD_API }}
        with:
          path: ./kurieros-astro
          node-version: 24.x

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # Notifies Bing, Yandex, Naver, Seznam, Yep about all sitemap URLs after deploy.
    # Key file is served at https://kurerok.ru/67329f22c3fc65f5bae72b458b279dae.txt
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for fresh sitemap on production
        run: sleep 60
      - name: Fetch sitemap URLs and push to IndexNow API
        run: |
          set -euo pipefail
          KEY="67329f22c3fc65f5bae72b458b279dae"
          HOST="kurerok.ru"
          KEY_LOCATION="https://${HOST}/${KEY}.txt"

          # Verify the key file is reachable on production
          curl -sf "$KEY_LOCATION" >/dev/null || { echo "Key file not reachable, skipping"; exit 0; }

          # Collect all <loc> URLs from sitemap-index + child sitemaps
          mkdir -p /tmp/indexnow
          curl -s "https://${HOST}/sitemap-index.xml" \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed 's|<loc>||;s|</loc>||' > /tmp/indexnow/sitemaps.txt
          : > /tmp/indexnow/urls.txt
          while read -r sm; do
            curl -s "$sm" \
              | grep -oE '<loc>[^<]+</loc>' \
              | sed 's|<loc>||;s|</loc>||' >> /tmp/indexnow/urls.txt
          done < /tmp/indexnow/sitemaps.txt

          TOTAL=$(wc -l < /tmp/indexnow/urls.txt | tr -d ' ')
          echo "Found $TOTAL URLs in sitemaps"
          [ "$TOTAL" -eq 0 ] && { echo "Empty sitemap, skipping"; exit 0; }

          # Submit in batches of 10000 (IndexNow per-request cap).
          # Build the JSON payload entirely via `jq` reading the URL list
          # from disk (`--rawfile`) and write it to a file, then have curl
          # POST from that file (`--data-binary @file`).  The previous
          # approach passed the full JSON through shell variables and
          # `--argjson urls "$URLS_JSON"` / `--data "$PAYLOAD"`, which
          # blew past the kernel ARG_MAX on ~5,500-URL payloads with
          # `Argument list too long` (E2BIG).  File-based plumbing is
          # bounded only by disk and avoids that ceiling entirely.
          split -l 10000 /tmp/indexnow/urls.txt /tmp/indexnow/batch_
          for batch in /tmp/indexnow/batch_*; do
            COUNT=$(wc -l < "$batch" | tr -d ' ')
            PAYLOAD_FILE="/tmp/indexnow/payload-$(basename "$batch").json"
            jq -n \
              --arg host "$HOST" \
              --arg key "$KEY" \
              --arg keyLoc "$KEY_LOCATION" \
              --rawfile rawurls "$batch" \
              '{
                host: $host,
                key: $key,
                keyLocation: $keyLoc,
                urlList: ($rawurls | split("\n") | map(select(length > 0)))
              }' > "$PAYLOAD_FILE"

            HTTP=$(curl -s -o /tmp/indexnow/response.txt -w "%{http_code}" \
              -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data-binary @"$PAYLOAD_FILE")
            echo "Batch $(basename "$batch"): $COUNT URLs, HTTP $HTTP"
            [ -s /tmp/indexnow/response.txt ] && cat /tmp/indexnow/response.txt
            # IndexNow returns: 200 OK / 202 Accepted / 422 if some URLs invalid (still ok)
            case "$HTTP" in
              200|202) ;;
              *) echo "::warning::IndexNow returned HTTP $HTTP for $(basename "$batch")" ;;
            esac
          done
          echo "IndexNow notification complete: $TOTAL URLs across $(ls /tmp/indexnow/batch_* | wc -l) batch(es)"
