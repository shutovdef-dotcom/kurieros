name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install, build, and upload Astro site
        uses: withastro/action@v3
        env:
          SITE_URL: https://kurerok.ru
          SITE_BASE: /
          PUBLIC_GA4_MEASUREMENT_ID: G-686FXGHBWB
          PUBLIC_YANDEX_METRIKA_ID: 108655359
          PUBLIC_OWNER_SEO_HASH: f08d870722fc49f961b4bddb87fe6b15c226f7880c5cc1da17697ce9be527073
          PUBLIC_GSC_PROPERTY_URL: sc-domain:kurerok.ru
          PUBLIC_YANDEX_WEBMASTER_HOST: https:kurerok.ru:443
          PUBLIC_YANDEX_VERIFICATION: 9a662580de5ebac5
          PUBLIC_GOOGLE_SITE_VERIFICATION: QIGlMj-JAXkxvnkeFNNu6hWJ5bslKtguuUxY4ty17bI
          # Ozon lead-form integration. Sourced from repository
          # Variables (Settings → Secrets and variables → Actions →
          # Variables) so the Worker URL can be rotated without a
          # code change. Astro inlines PUBLIC_-prefixed env vars
          # into client bundles at build time.
          #
          # The lead form now POSTs to a Cloudflare Worker proxy
          # (kurerok-ozon-lead.shutovdef.workers.dev). The referrer
          # phone, Telegram bot token, and chat ID live as Worker
          # secrets so they NEVER reach the browser. The legacy
          # PUBLIC_OZON_REF_CODE / PUBLIC_TELEGRAM_BOT_TOKEN /
          # PUBLIC_TELEGRAM_CHAT_ID variables are no longer
          # consumed by the build; remove them from repo Variables
          # and rotate the bot token (it was previously inlined into
          # the public bundle).
          PUBLIC_OZON_LEAD_API: ${{ vars.PUBLIC_OZON_LEAD_API }}
        with:
          path: ./kurieros-astro
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
