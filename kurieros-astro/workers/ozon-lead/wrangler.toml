name = "kurerok-ozon-lead"
main = "src/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

# Per-IP rate limit: 5 leads in 60 seconds. Anything over -> 429.
# Required so a bot can't burn Ozon SMS / Telegram quota by curling
# this endpoint directly (CORS-only protection is browser-side only).
# Rate-Limit API is in beta on Workers free tier and is eventually
# consistent — first ~5 reqs in a burst may slip through before the
# global state propagates, but sustained abuse is throttled.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://kurerok.ru,https://www.kurerok.ru"
OZON_CITIZENSHIP_ID = "7"
# OZON_VACANCY / OZON_CITY_ID / OZON_HIRE_OBJECT_UUID are no longer
# baked in here — they're now per-request body params validated against
# `src/whitelist.js` (auto-generated from src/data/ozon-vacancies.json).
# Re-run `node tools/build-worker-whitelist.mjs` from the repo root
# whenever the form's vacancy/city catalogue changes upstream, then
# `wrangler deploy` from this directory.

# Secrets are NOT defined here — set via wrangler CLI:
#   wrangler secret put OZON_REFERRER_NAME
#   wrangler secret put OZON_REFERRER_PHONE
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
